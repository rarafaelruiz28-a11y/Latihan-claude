// ---------- util ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const pop = (t, t0, d = 0.5) => { const x = clamp((t - t0) / d); if (x <= 0) return 0; const s = 2.2; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
let seed = 1; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + rnd() * (b - a);

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(RW, RH, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, RW / RH, 0.05, 400);
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera); composer.addPass(renderPass);

composer.addPass(bloom); composer.addPass(new OutputPass());

// lampu
const amb = new THREE.AmbientLight(0xffffff, 0.35); scene.add(amb);

// ---------- material ----------
const M = {

};

// tekstur dinding pembuluh darah (canvas)
function vesselTexture() {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512; const g = c.getContext('2d');
  g.fillStyle = '#7a0a14'; g.fillRect(0, 0, 512, 512); seed = 77;
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${R(150, 230) | 0},${R(10, 50) | 0},${R(30, 60) | 0},${R(0.05, 0.25)})`; g.beginPath(); g.ellipse(R(0, 512), R(0, 512), R(4, 40), R(2, 14), R(0, 3), 0, 7); g.fill(); }
  g.strokeStyle = 'rgba(255,120,140,0.35)'; g.lineWidth = 2;
  for (let i = 0; i < 40; i++) { g.beginPath(); let x = R(0, 512), y = R(0, 512); g.moveTo(x, y); for (let k = 0; k < 8; k++) { x += R(-30, 30); y += R(10, 40); g.lineTo(x, y); } g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 12); t.colorSpace = THREE.SRGBColorSpace; return t;
}
M.vessel = new THREE.MeshStandardMaterial({ map: vesselTexture(), side: THREE.BackSide, roughness: 0.6, emissive: 0x3a0008, emissiveIntensity: 1 });

// ---------- geometri / pembuat objek ----------
function makeRBC() { // sel darah merah: torus pipih + cakram tengah tipis
  const g = new THREE.Group();
  const tor = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.22, 20, 40), M.rbc); g.add(tor);
  const mid = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.12, 32), M.rbc); mid.rotation.x = Math.PI / 2; g.add(mid);
  g.scale.set(1, 1, 0.75); return g;
}
const sph = new THREE.SphereGeometry(0.11, 16, 12), bondG = new THREE.CylinderGeometry(0.035, 0.035, 1, 8);
function makeGlucose() { // cincin heksagon molekul glukosa
  const g = new THREE.Group(); const r = 0.32, pts = [];
  for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; pts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0)); }
  pts.forEach((p, k) => {
    const s = new THREE.Mesh(sph, M.gold); s.position.copy(p); g.add(s);
    const q = pts[(k + 1) % 6], b = new THREE.Mesh(bondG, M.goldBond);
    b.position.copy(p).add(q).multiplyScalar(0.5); b.scale.y = p.distanceTo(q); b.lookAt(q); b.rotateX(Math.PI / 2); g.add(b);
  });
  const tail = new THREE.Mesh(sph, M.gold); tail.position.set(0.55, 0.3, 0); g.add(tail);
  const tb = new THREE.Mesh(bondG, M.goldBond); tb.position.set(0.43, 0.22, 0); tb.scale.y = 0.28; tb.rotation.z = -1.05; g.add(tb);
  return g;
}
function makeKey(mat = M.keyMat) { // kunci insulin
  const g = new THREE.Group();
  const bow = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.08, 14, 32), mat); bow.position.x = -0.55; g.add(bow);
  const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.0, 12), mat); shaft.rotation.z = Math.PI / 2; shaft.position.x = 0.2; g.add(shaft);
  [[0.45, 0.14], [0.62, 0.1]].forEach(([x, h]) => { const tth = new THREE.Mesh(new THREE.BoxGeometry(0.1, h * 2, 0.1), mat); tth.position.set(x, -h, 0); g.add(tth); });
  return g;
}
const cubeG = new RoundedBoxGeometry(0.5, 0.5, 0.5, 3, 0.06);
function makeSugar() { return new THREE.Mesh(cubeG, M.sugar); }

// ---------- KELOMPOK ADEGAN ----------
// 1) Gelas boba
const boba = new THREE.Group(); scene.add(boba);
{
  const cup = new THREE.Mesh(new THREE.CylinderGeometry(1.25, 0.95, 3.6, 48, 1, true), M.cup); boba.add(cup);
  const tea = new THREE.Mesh(new THREE.CylinderGeometry(1.18, 0.92, 3.1, 48), M.tea); tea.position.y = -0.2; boba.add(tea);
  const lid = new THREE.Mesh(new THREE.SphereGeometry(1.25, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), M.cup); lid.position.y = 1.8; lid.scale.y = 0.35; boba.add(lid);
  seed = 5; for (let i = 0; i < 46; i++) { const p = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 12), M.pearl); const a = R(0, 6.28), rr = R(0, 0.8); p.position.set(Math.cos(a) * rr, R(-1.75, -0.95), Math.sin(a) * rr); boba.add(p); }
  const straw = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 4.6, 20), M.straw); straw.position.set(0.3, 1.6, 0); straw.rotation.z = -0.18; boba.add(straw);
}
// kubus gula yang meledak keluar
const sugars = []; seed = 11;
for (let i = 0; i < 26; i++) { const m = makeSugar(); m.userData = { dir: new THREE.Vector3(R(-1, 1), R(0.3, 1.4), R(-0.2, 1)).normalize(), sp: R(3, 6), rot: new THREE.Vector3(R(-3, 3), R(-3, 3), R(-3, 3)), d: R(0, 0.6) }; scene.add(m); sugars.push(m); }

// 2) Terowongan pembuluh darah
const vessel = new THREE.Mesh(new THREE.CylinderGeometry(5, 5, 260, 48, 1, true), M.vessel); vessel.rotation.x = Math.PI / 2; vessel.position.z = -110; scene.add(vessel);
const rbcs = []; seed = 21;
for (let i = 0; i < 70; i++) { const r = makeRBC(); const a = R(0, 6.28), rr = R(0.5, 4.2); r.userData = { x: Math.cos(a) * rr, y: Math.sin(a) * rr, z: R(-200, 10), rx: R(0, 6), ry: R(0, 6), sp: R(0.6, 1.4) }; scene.add(r); rbcs.push(r); }
const glus = []; seed = 31;
for (let i = 0; i < 90; i++) { const gl = makeGlucose(); const a = R(0, 6.28), rr = R(0.3, 4); gl.userData = { x: Math.cos(a) * rr, y: Math.sin(a) * rr, z: R(-200, 10), r: R(0, 6), sp: R(0.8, 1.6), k: i }; scene.add(gl); glus.push(gl); }
const keys = []; seed = 41;
for (let i = 0; i < 10; i++) { const k = makeKey(); k.userData = { a: R(0, 6.28), rr: R(0.8, 3), z: R(-40, -5), ph: R(0, 6) }; scene.add(k); keys.push(k); }

// 3) Sel dengan pintu (dekat ujung terowongan)
const cell = new THREE.Group(); scene.add(cell);
const cellBody = new THREE.Mesh(new THREE.SphereGeometry(3.2, 64, 48), M.cell); cell.add(cellBody);
const nucleus = new THREE.Mesh(new THREE.SphereGeometry(1.1, 32, 24), M.nucleus); nucleus.position.set(0.6, 0.5, -0.8); cell.add(nucleus);
const doorPivot = new THREE.Group(); doorPivot.position.set(-0.7, 0, 3.1); cell.add(doorPivot);
const door = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.16, 40), M.door); door.rotation.x = Math.PI / 2; door.position.x = 0.7; doorPivot.add(door);
const hole = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.34, 0.2), new THREE.MeshBasicMaterial({ color: 0x000000 })); hole.position.set(1.0, 0, 0.1); doorPivot.add(hole);
const frame = new THREE.Mesh(new THREE.TorusGeometry(0.74, 0.09, 12, 40), M.door); frame.position.set(0, 0, 3.12); cell.add(frame);
const innerGlu = []; seed = 51;
for (let i = 0; i < 40; i++) { const gl = makeGlucose(); gl.scale.setScalar(0.7); gl.userData = { p: new THREE.Vector3(R(-2, 2), R(-2, 2), R(-2, 2)).clampLength(0, 2.4), r: R(0, 6) }; cell.add(gl); innerGlu.push(gl); }
const locks = []; seed = 61;
for (let i = 0; i < 9; i++) { const l = new THREE.Group(); const b = new THREE.Mesh(new RoundedBoxGeometry(0.6, 0.55, 0.3, 2, 0.06), M.rust); l.add(b); const sh = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.06, 8, 20, Math.PI), M.rust); sh.position.y = 0.28; l.add(sh);
  const th = R(-1.1, 1.1), ph = R(-0.9, 0.9); const n = new THREE.Vector3(Math.sin(th) * Math.cos(ph), Math.sin(ph), Math.cos(th) * Math.cos(ph)); l.position.copy(n.clone().multiplyScalar(3.22)); l.lookAt(n.clone().multiplyScalar(10)); cell.add(l); locks.push(l); }

// 4) Tetes lemak
const fats = []; seed = 71;
for (let i = 0; i < 60; i++) { const f = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), M.fat); f.userData = { p: new THREE.Vector3(R(-5, 5), R(-8, 8), R(-6, 2)), s: R(0.5, 1.5), d: i * 0.07 }; scene.add(f); fats.push(f); }

// 5) Ikon sehat
const healthy = new THREE.Group(); scene.add(healthy);
const bottle = new THREE.Group(); { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2.2, 40), M.water); bottle.add(b); const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.35, 24), new THREE.MeshStandardMaterial({ color: 0x1e88e5 })); cap.position.y = 1.3; bottle.add(cap); }
const apple = new THREE.Group(); { const a = new THREE.Mesh(new THREE.SphereGeometry(0.8, 40, 30), M.apple); a.scale.y = 0.9; apple.add(a); const st = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x5a3a1a })); st.position.y = 0.85; apple.add(st); const lf = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 8), M.green); lf.scale.set(1, 0.3, 0.6); lf.position.set(0.25, 0.9, 0); apple.add(lf); }
const broc = new THREE.Group(); { const st = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.3, 1.1, 16), new THREE.MeshStandardMaterial({ color: 0x8fd17a })); st.position.y = -0.5; broc.add(st); seed = 81; for (let i = 0; i < 9; i++) { const b = new THREE.Mesh(new THREE.SphereGeometry(R(0.3, 0.45), 20, 16), M.green); b.position.set(R(-0.5, 0.5), R(0.1, 0.6), R(-0.4, 0.4)); broc.add(b); } }
healthy.add(bottle, apple, broc);

// ---------- bantu visibilitas ----------
const groups = { boba, cell, healthy };
function show(list) { // tampilkan hanya objek adegan aktif
  boba.visible = list.includes('boba'); cell.visible = list.includes('cell'); healthy.visible = list.includes('healthy');
  vessel.visible = list.includes('vessel');
  sugars.forEach(s => s.visible = list.includes('sugar'));
  rbcs.forEach(r => r.visible = list.includes('rbc'));
  glus.forEach(g => g.visible = list.includes('glu'));
  keys.forEach(k => k.visible = list.includes('keys'));
  fats.forEach(f => f.visible = list.includes('fat'));
}
function flowTunnel(t, speed, nGlu = 90, scaleGlu = 1) {
  rbcs.forEach(r => { const u = r.userData; let z = ((u.z + t * speed * u.sp) % 210 + 210) % 210 - 200; r.position.set(u.x + Math.sin(t + u.rx) * 0.2, u.y + Math.cos(t * 0.8 + u.ry) * 0.2, z); r.rotation.set(u.rx + t * 0.6, u.ry + t * 0.4, 0); });
  glus.forEach((gl, i) => { const u = gl.userData; gl.visible = gl.visible && i < nGlu; let z = ((u.z + t * speed * u.sp) % 210 + 210) % 210 - 200; gl.position.set(u.x, u.y + Math.sin(t * 1.3 + u.r) * 0.25, z); gl.rotation.set(t * 0.7 + u.r, t * 0.9, u.r); gl.scale.setScalar(scaleGlu); });
}

// ---------- adegan ----------
const T = { // waktu kunci (detik video)
  s1: 0, s2: V(4.75), s3: V(10.8), s4: V(19.25), s5: V(28.15), s6: V(43.9), end: 58
};
function setCam(x, y, z, tx, ty, tz, fov = 50) { camera.position.set(x, y, z); camera.lookAt(tx, ty, tz); if (camera.fov !== fov) { camera.fov = fov; camera.updateProjectionMatrix(); } }

let overlay = []; // label teks 2D untuk frame ini
function label(text, x, y, size, color, a = 1, s = 1, glow = color) { overlay.push({ text, x, y, size, color, a, s, glow }); }

function sceneHook(t) {
  show(['boba', 'sugar']); scene.background = new THREE.Color(0x12030a); scene.fog = null;
  rim.color.set(0xff3366); fill.color.set(0xffb86b);
  const orbit = t * 0.35;
  setCam(Math.sin(orbit) * 9, 1.2 + t * 0.15, Math.cos(orbit) * 9, 0, 0.6, 0);
  boba.position.set(0, -0.4, 0); boba.rotation.y = t * 0.3;
  sugars.forEach((s, i) => { const u = s.userData; const p = clamp((t - 1.2 - u.d) / 3.2); s.visible = p > 0; s.position.set(0.3, 3.6, 0).addScaledVector(u.dir, easeOut(p) * u.sp); s.position.y -= p * p * 2.5; s.rotation.set(u.rot.x * p, u.rot.y * p, u.rot.z * p); s.scale.setScalar(lerp(0.3, 1, easeOut(p * 3))); });
  bloom.strength = 0.5;
  const a = clamp(t / 0.6);
  label('APA YANG TERJADI', OW / 2, 300, 92, '#ffffff', a, pop(t, 0.1));
  label('DI TUBUHMU? 😳', OW / 2, 410, 92, '#ffd23f', a, pop(t, 0.35));
}
function sceneStomach(t) {
  const lt = t - T.s2;
  // kubus gula jatuh ke "lambung" bercahaya lalu pecah jadi glukosa, kamera masuk ke pembuluh
  show(['sugar', 'glu', 'vessel', 'rbc']); scene.background = new THREE.Color(0x1a0204);
  scene.fog = new THREE.FogExp2(0x2a0308, 0.045);
  rim.color.set(0xff6a3d); fill.color.set(0xffc870);
  const dive = ease((t - V(8.3)) / 2.2);
  setCam(0, lerp(1.5, 0, dive), lerp(8, -4, dive), 0, lerp(-0.5, 0, dive), lerp(0, -30, dive));
  sugars.forEach((s, i) => { const u = s.userData; const fall = clamp((lt - u.d * 1.5) / 2.2); const brk = clamp((t - V(7.4) - i * 0.02) / 0.5);
    s.visible = brk < 1; s.position.set(Math.sin(i * 2.4) * 2.2, lerp(6, -0.5, ease(fall)), Math.cos(i * 1.7) * 1.5 - 2); s.rotation.set(lt * u.rot.x * 0.5, lt * u.rot.y * 0.5, 0); s.scale.setScalar(1 - brk); });
  const g = clamp((t - V(7.5)) / 0.8);
  flowTunnel(t, lerp(2, 14, dive), Math.round(lerp(0, 60, g)), lerp(0.2, 1, g));
  vessel.material.emissiveIntensity = 1.2;
  bloom.strength = 0.6;
  label('GULA ➜ GLUKOSA', OW / 2, 330, 84, '#ffd23f', clamp((t - V(7.5)) / 0.4) * (1 - clamp((t - V(9.8)) / 0.4)), pop(t, V(7.5)));
}
function sceneInsulin(t) {
  show(['vessel', 'rbc', 'glu', 'keys', 'cell']); scene.background = new THREE.Color(0x1a0204);
  scene.fog = new THREE.FogExp2(0x2a0308, 0.03);
  rim.color.set(0xff3355); fill.color.set(0xffd27a);
  const approach = ease((t - V(13.0)) / 2.6);
  const cz = lerp(-14, -9.5, approach);
  setCam(lerp(0, -1.2, approach), lerp(0, 0.2, approach), cz + lerp(10, 6.5, approach), lerp(0, -0.7, approach), 0, cz);
  cell.position.set(0, 0, cz - 3.5); cell.rotation.set(0, 0, 0); cellBody.material.emissiveIntensity = 1;
  flowTunnel(t, lerp(10, 3, approach), 60, 1);
  // kunci insulin berdatangan (pankreas melepas insulin)
  keys.forEach((k, i) => { const u = k.userData; const inA = clamp((t - V(10.9) - i * 0.12) / 1.2);
    k.visible = inA > 0; const a = u.a + t * 0.5; k.position.set(Math.cos(a) * u.rr * 1.2, Math.sin(a) * u.rr, lerp(cz + 9, cz + 0.5 + (i % 3) * 0.8, easeOut(inA))); k.scale.setScalar(0.8); k.rotation.set(t + u.ph, t * 0.7, 0); });
  // satu kunci utama masuk ke lubang kunci pintu
  const main = keys[0], kp = ease((t - V(14.0)) / 1.3);
  const doorWorld = new THREE.Vector3(-0.7 + 1.0, 0, 3.25).add(cell.position);
  main.visible = true; main.position.lerpVectors(new THREE.Vector3(-2.5, 1.6, cz + 4), doorWorld.clone().add(new THREE.Vector3(-0.75, 0.15, 0.25)), kp);
  main.rotation.set(0, lerp(0.6, -Math.PI / 2 + 0.0, kp), kp >= 1 ? -Math.min(1, (t - V(15.3)) * 3) * 1.4 : 0);
  main.rotation.order = 'YXZ';
  const open = ease((t - V(15.6)) / 0.8); doorPivot.rotation.y = -open * 1.9;
  // glukosa tersedot masuk ke sel, sel menyala (energi)
  innerGlu.forEach((g, i) => { const p = clamp((t - V(16.4) - i * 0.03) / 1.0); g.visible = p > 0; const from = new THREE.Vector3(-0.1, 0, 5.5); g.position.lerpVectors(from, g.userData.p, ease(p)); g.rotation.set(t + g.userData.r, t, 0); });
  locks.forEach(l => l.visible = false);

// ---------- subtitle (gaya Shorts) ----------
function captions(t) {
  const cap = (window.CAPTIONS || []).find(c => t >= c.start - 0.05 && t < c.end);
  if (!cap) return;
  const size = 78, y = 1480, sp = 20;
  o.font = `700 ${size}px "Inter Display", Inter, sans-serif`; o.textBaseline = 'middle'; o.textAlign = 'left';
  const ws = cap.words.map(w => w.t.toLowerCase());
  const widths = ws.map(w => o.measureText(w).width), total = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  const s = Math.min(1, 960 / total);
  o.save(); o.translate(OW / 2, y); o.scale(s, s);
  let x = -total / 2;
  cap.words.forEach((w, i) => {
    o.shadowColor = 'rgba(0,0,0,0.85)'; o.shadowBlur = 18; o.shadowOffsetY = 4;
    o.lineJoin = 'round'; o.lineWidth = 6; o.strokeStyle = 'rgba(0,0,0,0.55)'; o.strokeText(ws[i], x, 0);
    o.fillStyle = '#ffffff'; o.fillText(ws[i], x, 0); x += widths[i] + sp;
  });
  o.restore();
}

// ---------- komposisi frame ----------
function drawOverlay() {
  for (const L of overlay) {
    if (L.a <= 0 || L.s <= 0) continue;
    o.save(); o.globalAlpha = clamp(L.a); o.translate(L.x, L.y); o.scale(L.s, L.s);
    o.font = `900 ${L.size}px "Inter Display", Inter, "Noto Color Emoji", sans-serif`; o.textAlign = 'center'; o.textBaseline = 'middle';
    const fw = o.measureText(L.text).width; if (fw > 960) o.scale(960 / fw, 960 / fw);
    o.lineJoin = 'round'; o.lineWidth = L.size * 0.2; o.strokeStyle = 'rgba(0,0,0,0.9)'; o.strokeText(L.text, 0, 0);
    o.shadowColor = L.glow; o.shadowBlur = 30; o.fillStyle = L.color; o.fillText(L.text, 0, 0); o.restore();
  }
}

function skyCol(c) { npcScene.background = c; npcScene.fog = new THREE.Fog(c.getHex(), 8, 22); }
function scrollProps(t, speed) { props.forEach(p => { const x = ((p.userData.x0 - t * speed) % 24 + 24) % 24 - 12; p.position.set(x, 0, p.userData.z); }); groundTex.offset.x = t * speed / 2; }

// ---- adegan NPC ----
function npcHook(t) { // 0..T.s2 : minum boba -> x-ray -> gula ke lambung
  hideAllNPCProps(); setWorld('street'); setXray(0); skyCol(new THREE.Color(0x9fd3f2)); hemi.intensity = 1.3; sun.intensity = 2.6;
  buildings.children.forEach(b => b.material.emissiveIntensity = 0); props.forEach(p => p.userData.lamp && (p.userData.lamp.material.emissiveIntensity = 0)); scrollProps(0, 0);
  NPC.char.position.set(0, 0, 0); NPC.char.rotation.y = 0;
  NPC.pose({ idle: 1 }, t + 1);
  const head = bw('Head'); const mouth = head.clone().add(CFG.bobaMouth);
  const rest = bw('RightHand').add(new THREE.Vector3(0.02, 0.15, 0.18));
  const lift = ease((t - 1.0) / 1.3) * (1 - ease((t - 4.1) / 0.8) * 0.15);
  const target = rest.clone().lerp(mouth, lift).add(new THREE.Vector3(0, 0, Math.sin(Math.PI * lift) * 0.15));
  armTo('Right', target, 1);
  const sip = clamp((t - 2.3) / 0.3) * (1 - clamp((t - 3.6) / 0.4));
  NPC.bone('Head').rotateX(-0.12 * sip * CFG.headTilt); NPC.bone('Head').updateMatrixWorld(true);
  holdProp(npcCup, 'Right', lift * 0.15);
  const xr = ease((t - 3.3) / 0.6); setXray(xr);
  const spine = bw(CFG.stomach[0]); xStomach.visible = xr > 0; xStomach.position.copy(spine).add(CFG.stomach[1]); xStomach.material.opacity = 0.9 * xr;
  npcSugar.forEach((s, i) => { const p = clamp((t - 3.5 - i * 0.07) / 0.9); s.visible = xr > 0.3 && p > 0 && p < 1; s.position.lerpVectors(mouth.clone().add(new THREE.Vector3(0, -0.05, -0.08)), xStomach.position, ease(p)); s.rotation.set(t * 3 + i, t * 2, 0); });
  // kamera: lebar -> medium close-up -> menembus ke lambung
  const push = ease(t / 3.4), dive = ease((t - 4.3) / 1.25);
  const camA = new THREE.Vector3(0.9, 1.25, 3.0), camB = CFG.hookB.clone(), camC = xStomach.position.clone().add(new THREE.Vector3(0.02, 0.02, 0.12));
  const lookA = new THREE.Vector3(0, 1.1, 0), lookB = head.clone().add(new THREE.Vector3(0, CFG.hookLook, 0)), lookC = xStomach.position;
  const cp = camA.clone().lerp(camB, push).lerp(camC, dive), lp = lookA.clone().lerp(lookB, push).lerp(lookC, dive);
  camera.position.copy(cp).add(new THREE.Vector3(Math.sin(t * 1.3) * 0.01, Math.cos(t * 1.1) * 0.01, 0)); camera.lookAt(lp); camera.fov = 40; camera.updateProjectionMatrix();
  npcRim.color.set(0x9fd8ff); bloom.strength = 0.22 + 0.2 * xr;
}
function npcFat(t) { // NPC x-ray, lemak tumbuh di perut
  hideAllNPCProps(); setWorld('street'); props.forEach(p => p.visible = false); skyCol(new THREE.Color(0x0e1a2a)); hemi.intensity = 0.6; sun.intensity = 1.0;
  NPC.char.position.set(0, 0, 0); NPC.char.rotation.y = 0.6; NPC.pose({ idle: 0.4, sad_pose: 0.6 }, t);
  setXray(1);
  const lt = t - V(25.0), grow = ease(lt / 2.4);
  const spine = bw('Spine'); xFat.visible = true; xFat.position.copy(bw('Hips')).add(CFG.fat.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.6)); xFat.scale.set(lerp(0.3, 0.8, grow), lerp(0.3, 0.65, grow), lerp(0.3, 0.85, grow));
  const pulse = 0.5 + 0.5 * Math.sin(t * 5); xFat.material.emissiveIntensity = 0.35 + 0.25 * pulse;
  camera.position.copy(CFG.fatCam[0]).add(new THREE.Vector3(-lt * 0.12, 0, -lt * 0.15)); camera.lookAt(spine); camera.fov = 40; camera.updateProjectionMatrix();
  npcRim.color.set(0xffc24d); bloom.strength = 0.6;
}
function npcYears(t) { // berjalan lesu, siang-malam berganti cepat (bertahun-tahun)
  hideAllNPCProps(); setWorld('street'); stall.visible = false; setXray(0);
  const lt = t - T.s5, cyc = (Math.sin(lt * 3.2 - 1.2) + 1) / 2; // 0 malam .. 1 siang
  skyCol(new THREE.Color().lerpColors(new THREE.Color(0x0b1430), new THREE.Color(0xa9d6f5), cyc)); hemi.intensity = lerp(0.35, 1.3, cyc); sun.intensity = lerp(0.2, 2.4, cyc);
  buildings.children.forEach(b => b.material.emissiveIntensity = (1 - cyc) * 0.9); props.forEach(p => p.userData.lamp && (p.userData.lamp.material.emissiveIntensity = (1 - cyc) * 2));
  NPC.char.position.set(0, 0, 0); NPC.char.rotation.y = Math.PI / 2; NPC.pose({ walk: 1 - 0.3 * ease(lt / 3), sad_pose: 0.3 * ease(lt / 3) }, t * 0.85);
  scrollProps(t, 0.9);
  const spine = bw('Spine'); belly.visible = true; belly.position.copy(spine).add(CFG.belly); if (CFG.bellyColor) belly.material.color.set(CFG.bellyColor); const bs = lerp(0.5, CHAR === 'michelle' ? 1.1 : 0.8, ease(lt / 3)); belly.scale.set(bs, bs * 0.9, bs);
  litter.forEach((c, i) => { c.visible = i < 3 + lt * 4; seed = 200 + i; const x = ((R(-12, 12) - t * 0.9) % 24 + 24) % 24 - 12; c.position.set(x, 0.05, R(-0.6, 0.6)); c.rotation.set(Math.PI / 2, 0, R(0, 6)); });
  camera.position.copy(CFG.walkCam[0]); camera.lookAt(CFG.walkCam[1]); camera.fov = 40; camera.updateProjectionMatrix();
  npcRim.color.set(0xaab8ff); bloom.strength = 0.35;
}
function npcHealthy(t) { // air putih -> jogging -> mengangguk
  hideAllNPCProps(); setWorld('park'); stall.visible = false; setXray(0); skyCol(new THREE.Color(0x8fd3ff)); hemi.intensity = 1.4; sun.intensity = 2.8;
  buildings.children.forEach(b => b.material.emissiveIntensity = 0); props.forEach(p => p.userData.lamp && (p.userData.lamp.material.emissiveIntensity = 0));
  const t1 = V(49.4), t2 = V(52.1);
  if (t < t1) { // minum air putih
    NPC.char.position.set(0, 0, 0); NPC.char.rotation.y = 0; NPC.pose({ idle: 1 }, t); scrollProps(0, 0);
    const lt = t - T.s6; const head = bw('Head'), mouth = head.clone().add(CFG.waterMouth);
    const rest = bw('RightHand').add(new THREE.Vector3(0.02, 0.15, 0.18)); const lift = ease((t - V(47.6)) / 0.8) * (1 - ease((t - (t1 - 0.5)) / 0.5));
    armTo('Right', rest.clone().lerp(mouth, lift).add(new THREE.Vector3(0, 0, Math.sin(Math.PI * lift) * 0.15)), 1);
    NPC.bone('Head').rotateX(-0.25 * lift * CFG.headTilt); NPC.bone('Head').updateMatrixWorld(true); holdProp(npcBottle, 'Right', lift * 1.2);
    camera.position.copy(CFG.drinkCam[0]).add(new THREE.Vector3(0, 0, -lt * 0.08)); camera.lookAt(CFG.drinkCam[1]);
  } else if (t < t2) { // jogging

  } else { // mengangguk senang ke kamera
    const lt = t - t2; NPC.char.position.set(0, 0, 0); NPC.char.rotation.y = 0; NPC.pose({ agree: 0.8, idle: 0.2 }, lt + 0.2); scrollProps(0, 0);
    camera.position.lerpVectors(CFG.endCam[0], CFG.endCam[1], ease(lt / 3)); camera.lookAt(CFG.endCam[2]);
  }
  camera.fov = 40; camera.updateProjectionMatrix(); npcRim.color.set(0xffffff); bloom.strength = 0.2;
}
function render(t) {
  overlay = [];
  let useNPC = true;
  if (t < T.s2) npcHook(t);
  else if (t < T.s3) { useNPC = false; sceneStomach(t); }
  else if (t < T.s4) { useNPC = false; sceneInsulin(t); }
  else if (t < T.s5) { if (t >= V(25.0)) npcFat(t); else { useNPC = false; sceneFat(t); } }
  else if (t < T.s6) { if (t < V(31.35)) npcYears(t); else { useNPC = false; sceneDiabetes(t); } }
  else npcHealthy(t);
  renderPass.scene = useNPC ? npcScene : scene;
  (useNPC ? npcScene : scene).updateMatrixWorld(true);
  composer.render();
  o.drawImage(renderer.domElement, 0, 0, OW, OH);
  // vignette sinematik
  const vg = o.createRadialGradient(OW / 2, OH / 2, OH * 0.3, OW / 2, OH / 2, OH * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.55)'); o.fillStyle = vg; o.fillRect(0, 0, OW, OH);
  captions(t);
  // transisi kilat putih di setiap potongan adegan
  for (const c of [T.s2, T.s3, T.s4, V(25.0), T.s5, V(31.35), V(35.3), T.s6]) { const d = Math.abs(t - c); if (d < 0.18) { o.fillStyle = `rgba(255,255,255,${0.85 * (1 - d / 0.18)})`; o.fillRect(0, 0, OW, OH); } }
  if (t < 0.3) { o.fillStyle = `rgba(0,0,0,${1 - t / 0.3})`; o.fillRect(0, 0, OW, OH); }
  if (t > T.end - 1.2) { o.fillStyle = `rgba(0,0,0,${clamp((t - (T.end - 1.2)) / 1.2)})`; o.fillRect(0, 0, OW, OH); }
}
window.frame = (t, q) => { render(t); return out.toDataURL('image/jpeg', q || 0.9); };
await document.fonts.load('900 80px "Inter Display"'); await document.fonts.load('700 80px "Inter Display"');
window.ready = true;
</script>
